<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duty & Attendance Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen p-4 sm:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Duty & Attendance Tracker</h1>
                <p class="text-xs font-medium text-indigo-600 mt-1" id="header-cycle-label">Timesheet Cycle: Custom</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="shareApp()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-medium text-xs py-2 px-3.5 rounded-xl border border-indigo-200 transition flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                    Share App
                </button>
                <div class="text-left sm:text-right border-l pl-3 border-gray-200">
                    <p class="text-xs text-gray-500 uppercase tracking-wider">Today</p>
                    <p class="text-sm font-semibold text-gray-800" id="current-date"></p>
                </div>
            </div>
        </header>

        <!-- Settings Card (Hours & Cycle Type) -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Daily Duty Hours</label>
                <div class="flex items-center gap-2">
                    <input type="number" id="shift-hours-input" step="0.5" min="1" max="24" class="w-full bg-gray-50 border border-gray-300 text-gray-900 font-bold text-center py-2 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" value="10">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Timesheet Cycle Type</label>
                <select id="cycle-type-select" class="w-full bg-gray-50 border border-gray-300 text-gray-900 font-medium py-2 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    <option value="21_to_20">21st to 20th of next month</option>
                    <option value="1_to_end">1st to End of month</option>
                </select>
            </div>
            <div class="sm:col-span-2 flex justify-end">
                <button onclick="saveSettings()" class="bg-gray-900 hover:bg-indigo-600 text-white text-xs font-medium py-2.5 px-6 rounded-xl transition duration-150 shadow-sm">
                    Save Settings
                </button>
            </div>
        </div>

        <!-- Daily Prompt Card (Hidden if already answered today) -->
        <div id="daily-prompt-card" class="bg-white p-6 rounded-2xl shadow-md border-2 border-indigo-500 hidden">
            <div class="flex items-center gap-3 mb-3">
                <span class="flex h-3 w-3 relative">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
                </span>
                <h2 class="text-lg font-bold text-gray-900">Daily Attendance Check</h2>
            </div>
            <p class="text-gray-600 mb-6 text-base" id="prompt-question-text"></p>
            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="markAttendance(true)" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-xl transition duration-150 shadow-sm flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Yes, Went to Duty (<span id="btn-hours-label">10</span> Hours)
                </button>
                <button onclick="markAttendance(false)" class="flex-1 bg-white hover:bg-gray-50 text-rose-600 border border-rose-200 font-medium py-3 px-6 rounded-xl transition duration-150 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    No, Absent / Off Day
                </button>
            </div>
        </div>

        <!-- Active Cycle Summary Dashboard -->
        <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm space-y-5">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-100 pb-4 gap-2">
                <h2 class="text-base font-bold text-gray-800">Current Timesheet Summary</h2>
                <span class="text-xs font-medium bg-indigo-50 text-indigo-700 py-1 px-3 rounded-full border border-indigo-100" id="cycle-range-text"></span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 text-center">
                    <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Total Present Days</p>
                    <p class="text-2xl font-bold text-emerald-600 mt-1" id="total-present">0</p>
                </div>
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 text-center">
                    <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Total Absents</p>
                    <p class="text-2xl font-bold text-rose-600 mt-1" id="total-absent">0</p>
                </div>
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 text-center">
                    <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Total Hours Worked</p>
                    <p class="text-2xl font-bold text-indigo-600 mt-1"><span id="total-hours">0</span> <span class="text-sm font-normal text-gray-500">Hrs</span></p>
                </div>
            </div>
        </div>

        <!-- History Records Table -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold text-gray-800">Attendance History</h2>
                <span class="text-xs text-gray-400 font-medium">Records are permanent & secure</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-100 text-gray-400 text-xs uppercase tracking-wider">
                            <th class="py-3 px-3">Date</th>
                            <th class="py-3 px-3">Status</th>
                            <th class="py-3 px-3">Hours</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body" class="divide-y divide-gray-100 text-sm">
                        <!-- Dynamic Data injected via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
        function getTodayDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDisplayDate(dateStr) {
            const options = { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' };
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', options);
        }

        // سائیکل ٹائپ کے حساب سے چیک کریں کہ آیا تاریخ موجودہ سائیکل میں آتی ہے یا نہیں
        function isDateInActiveCycle(dateStr, cycleType, activeCycle) {
            return dateStr >= activeCycle.startDate && dateStr <= activeCycle.endDate;
        }

        // موجودہ فعال سائیکل کی رینج معلوم کرنا (چاہے 21 سے 20 ہو یا 1st سے End)
        function getCurrentActiveCycle(cycleType) {
            const now = new Date();
            let y = now.getFullYear();
            let m = now.getMonth() + 1;
            let d = now.getDate();

            let startYear, startMonth, endYear, endMonth;

            if (cycleType === '21_to_20') {
                if (d >= 21) {
                    startMonth = m;
                    startYear = y;
                    endMonth = m + 1;
                    endYear = y;
                    if (endMonth > 12) { endMonth = 1; endYear += 1; }
                } else {
                    startMonth = m - 1;
                    startYear = y;
                    if (startMonth < 1) { startMonth = 12; startYear -= 1; }
                    endMonth = m;
                    endYear = y;
                }
                return {
                    startDate: `${startYear}-${String(startMonth).padStart(2, '0')}-21`,
                    endDate: `${endYear}-${String(endMonth).padStart(2, '0')}-20`
                };
            } else {
                // 1st to End of current month
                startMonth = m;
                startYear = y;
                // مہینے کا آخری دن معلوم کرنا
                let lastDay = new Date(y, m, 0).getDate();
                return {
                    startDate: `${startYear}-${String(startMonth).padStart(2, '0')}-01`,
                    endDate: `${startYear}-${String(startMonth).padStart(2, '0')}-${lastDay}`
                };
            }
        }

        let attendanceData = JSON.parse(localStorage.getItem('duty_attendance_data')) || {};
        let defaultShiftHours = parseFloat(localStorage.getItem('duty_shift_hours')) || 10;
        let cycleType = localStorage.getItem('duty_cycle_type') || '21_to_20';

        function initApp() {
            const todayStr = getTodayDateString();
            document.getElementById('current-date').innerText = formatDisplayDate(todayStr);
            
            // سیٹنگ ویلیوز سیٹ کریں
            document.getElementById('shift-hours-input').value = defaultShiftHours;
            document.getElementById('btn-hours-label').innerText = defaultShiftHours;
            document.getElementById('cycle-type-select').value = cycleType;
            
            const cycleText = cycleType === '21_to_20' ? 'Timesheet Cycle: 21st to 20th' : 'Timesheet Cycle: 1st to End of Month';
            document.getElementById('header-cycle-label').innerText = cycleText;

            if (!attendanceData[todayStr]) {
                document.getElementById('daily-prompt-card').classList.remove('hidden');
                document.getElementById('prompt-question-text').innerText = `Did you go to duty today (${formatDisplayDate(todayStr)})?`;
            } else {
                document.getElementById('daily-prompt-card').classList.add('hidden');
            }

            updateDashboardAndTable();
        }

        function saveSettings() {
            const inputVal = parseFloat(document.getElementById('shift-hours-input').value);
            const selectVal = document.getElementById('cycle-type-select').value;

            if (isNaN(inputVal) || inputVal <= 0) {
                alert("Please enter a valid number of hours.");
                return;
            }

            defaultShiftHours = inputVal;
            cycleType = selectVal;

            localStorage.setItem('duty_shift_hours', defaultShiftHours);
            localStorage.setItem('duty_cycle_type', cycleType);
            
            document.getElementById('btn-hours-label').innerText = defaultShiftHours;

            alert("Settings saved successfully!");
            initApp();
        }

        function markAttendance(isWent) {
            const todayStr = getTodayDateString();
            
            if (isWent) {
                attendanceData[todayStr] = { status: 'Present', hours: defaultShiftHours };
            } else {
                attendanceData[todayStr] = { status: 'Absent', hours: 0 };
            }

            localStorage.setItem('duty_attendance_data', JSON.stringify(attendanceData));
            document.getElementById('daily-prompt-card').classList.add('hidden');
            updateDashboardAndTable();
        }

        function shareApp() {
            const shareText = "Check out this awesome Duty & Attendance Tracker Web App to manage your work hours and monthly timesheet easily!";
            if (navigator.share) {
                navigator.share({
                    title: 'Duty & Attendance Tracker',
                    text: shareText,
                    url: window.location.href,
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("App link copied to clipboard!");
            }
        }

        function updateDashboardAndTable() {
            const activeCycle = getCurrentActiveCycle(cycleType);
            document.getElementById('cycle-range-text').innerText = `${activeCycle.startDate} to ${activeCycle.endDate}`;

            let totalPresent = 0;
            let totalAbsent = 0;
            let totalHours = 0;

            const tableBody = document.getElementById('history-table-body');
            tableBody.innerHTML = '';

            const sortedDates = Object.keys(attendanceData).sort().reverse();

            if (sortedDates.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" class="text-center py-6 text-gray-400">No attendance records found.</td></tr>`;
            }

            sortedDates.forEach(dateStr => {
                const record = attendanceData[dateStr];
                
                // چیک کریں کہ آیا یہ انٹری موجودہ سلیکٹ شدہ سائیکل کے اندر آتی ہے یا نہیں
                if (isDateInActiveCycle(dateStr, cycleType, activeCycle)) {
                    if (record.status === 'Present') {
                        totalPresent++;
                        totalHours += record.hours;
                    } else {
                        totalAbsent++;
                    }
                }

                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50/80 transition";
                
                const statusBadge = record.status === 'Present' 
                    ? `<span class="bg-emerald-50 text-emerald-700 py-1 px-3 rounded-full text-xs font-semibold border border-emerald-200">Present</span>`
                    : `<span class="bg-rose-50 text-rose-700 py-1 px-3 rounded-full text-xs font-semibold border border-rose-200">Absent</span>`;

                row.innerHTML = `
                    <td class="py-3.5 px-3 text-gray-700 font-medium">${dateStr}</td>
                    <td class="py-3.5 px-3">${statusBadge}</td>
                    <td class="py-3.5 px-3 font-semibold text-gray-800">${record.hours} Hrs</td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById('total-present').innerText = totalPresent;
            document.getElementById('total-absent').innerText = totalAbsent;
            document.getElementById('total-hours').innerText = totalHours;
        }

        window.onload = initApp;
    </script>
</body>
</html>
